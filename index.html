*{

}

html,body,#root{
  margin:0;
  min-height:100%;
  background:var(--surface);
  color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,sans-serif
}

.font-display{
  font-family:'Sora','Plus Jakarta Sans',sans-serif
}

.no-scrollbar::-webkit-scrollbar{
  display:none
}

.no-scrollbar{
  scrollbar-width:none
}

.doodle{
  background-color:var(--chatbg);
  background-image:radial-gradient(circle at 18% 22%, rgba(18,140,126,.14) 0 2px, transparent 3px),radial-gradient(circle at 78% 68%, rgba(7,94,84,.12) 0 2px, transparent 3px),radial-gradient(circle at 52% 88%, rgba(37,211,102,.13) 0 1px, transparent 2px);
  background-size:58px 58px,74px 74px,44px 44px
}

.shake{
  animation:shake .4s ease
}

@keyframes shake{
  0%,100%{
    transform:translateX(0)
  }

  25%{
    transform:translateX(-7px)
  }

  75%{
    transform:translateX(7px)
  }
}

@keyframes pop{
  from{
    opacity:0;
    transform:translateY(8px) scale(.98)
  }

  to{
    opacity:1;
    transform:none
  }
}

.pop{
  animation:pop .22s ease both
}

@keyframes typing{
  0%,60%,100%{
    transform:translateY(0);
    opacity:.4
  }

  30%{
    transform:translateY(-4px);
    opacity:1
  }
}

.typing span{
  animation:typing 1s infinite
}

.typing span:nth-child(2){
  animation-delay:.15s
}

.typing span:nth-child(3){
  animation-delay:.3s
}

@keyframes pulseDot{
  0%{
    box-shadow:0 0 0 0 rgba(37,211,102,.5)
  }

  100%{
    box-shadow:0 0 0 9px transparent
  }
}

.live-dot{
  animation:pulseDot 1.6s infinite
}

@keyframes load{
  from{
    width:8%
  }

  to{
    width:100%
  }
}

.loadbar{
  animation:load 1.7s ease forwards
}

@keyframes floaty{
  0%,100%{
    transform:translateY(0)
  }

  50%{
    transform:translateY(-7px)
  }
}

.floaty{
  animation:floaty 3s ease-in-out infinite
}

@keyframes logoPulse{
  0%{
    transform:scale(1);
    box-shadow:0 18px 45px rgba(0,0,0,.35),0 0 0 0 rgba(37,211,102,.45)
  }

  50%{
    transform:scale(1.035);
    box-shadow:0 22px 55px rgba(0,0,0,.38),0 0 0 16px rgba(37,211,102,0)
  }

  100%{
    transform:scale(1);
    box-shadow:0 18px 45px rgba(0,0,0,.35),0 0 0 0 rgba(37,211,102,0)
  }
}

.logo-pulse{
  animation:logoPulse 2.2s ease-in-out infinite
}

@keyframes logoSpin{
  from{
    transform:rotate(0deg)
  }

  to{
    transform:rotate(360deg)
  }
}

.logo-spin{
  animation:logoSpin 1.8s linear infinite
}

  0%{

    opacity:.7
  }

  100%{
    transform:scale(1.18);

  }
}

.logo-ring{
